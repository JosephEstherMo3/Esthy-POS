name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Set DATABASE_URL
        run: |
          echo "DATABASE_URL=postgres://postgres:password@localhost:5432/ce_test?sslmode=disable" >> $GITHUB_ENV

      - name: Run auth e2e tests
        run: node e2e-auth-test.cjs
